name: crypto_pipeline
version: "1.0.0"
config-version: 2

profile: crypto_pipeline_clickhouse

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]

target-path: "target"
packages-install-path: "{{ env_var('DBT_PACKAGES_INSTALL_PATH', 'dbt_packages') }}"
clean-targets:
  - "target"
  - "dbt_packages"

models:
  crypto_pipeline:
    +materialized: view
    marts:
      +materialized: view
      +tags: ["gold_mart"]
      market:
        +materialized: view
        +tags: ["gold_core", "serving"]
