crypto_pipeline_clickhouse:
  target: dev
  outputs:
    dev:
      type: clickhouse
      schema: gold
      host: "{{ env_var('CLICKHOUSE_HOST', 'localhost') }}"
      port: "{{ env_var('CLICKHOUSE_PORT', '8123') | int }}"
      user: "{{ env_var('CLICKHOUSE_DBT_USER', 'coinwhale') }}"
      password: "{{ env_var('CLICKHOUSE_DBT_PASSWORD') }}"
      secure: false
      verify: false
      connect_timeout: 10
      send_receive_timeout: 300
