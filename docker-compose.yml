name: coinwhale-data-pipeline

x-spark-image: &spark-image
  image: coinwhale-data-pipeline-spark:3.5.8
  build:
    context: .
    dockerfile: docker/spark/Dockerfile

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.3.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test: ["CMD-SHELL", "echo srvr | nc localhost 2181 | grep -q Mode"]
      interval: 10s
      timeout: 5s
      retries: 10

  kafka-1:
    image: confluentinc/cp-kafka:7.3.0
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "127.0.0.1:${KAFKA_HOST_PORT:-9092}:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-1:29092,EXTERNAL://localhost:${KAFKA_HOST_PORT:-9092}
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:29092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 20

  clickhouse:
    image: clickhouse/clickhouse-server:26.1.2.11
    ports:
      - "127.0.0.1:${CLICKHOUSE_HTTP_PORT:-8123}:8123"
      - "127.0.0.1:${CLICKHOUSE_NATIVE_PORT:-9000}:9000"
    environment:
      CLICKHOUSE_USER: "${CLICKHOUSE_USER:-coinwhale}"
      CLICKHOUSE_PASSWORD: "${CLICKHOUSE_PASSWORD:?set CLICKHOUSE_PASSWORD in .env}"
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./database/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 20

  spark-master:
    <<: *spark-image
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    ports:
      - "127.0.0.1:${SPARK_UI_PORT:-8080}:8080"
      - "127.0.0.1:${SPARK_MASTER_PORT:-7077}:7077"
    environment:
      SPARK_MASTER_HOST: spark-master
      SPARK_VERSION: "${SPARK_VERSION:-3.5.8}"
      SPARK_SQL_SHUFFLE_PARTITIONS: "${SPARK_SQL_SHUFFLE_PARTITIONS:-8}"
      KAFKA_BOOTSTRAP_SERVERS: kafka-1:29092
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: 8123
      CLICKHOUSE_USER: "${CLICKHOUSE_USER:-coinwhale}"
      CLICKHOUSE_PASSWORD: "${CLICKHOUSE_PASSWORD:?set CLICKHOUSE_PASSWORD in .env}"
    volumes:
      - spark_checkpoints:/opt/spark/work-dir/checkpoints
      - spark_dlq:/opt/spark/work-dir/dlq

  spark-worker:
    <<: *spark-image
    depends_on:
      - spark-master
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    environment:
      SPARK_WORKER_MEMORY: "${SPARK_WORKER_MEMORY:-2g}"
      SPARK_WORKER_CORES: "${SPARK_WORKER_CORES:-2}"
      SPARK_VERSION: "${SPARK_VERSION:-3.5.8}"
      SPARK_SQL_SHUFFLE_PARTITIONS: "${SPARK_SQL_SHUFFLE_PARTITIONS:-8}"
      KAFKA_BOOTSTRAP_SERVERS: kafka-1:29092
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: 8123
      CLICKHOUSE_USER: "${CLICKHOUSE_USER:-coinwhale}"
      CLICKHOUSE_PASSWORD: "${CLICKHOUSE_PASSWORD:?set CLICKHOUSE_PASSWORD in .env}"
    volumes:
      - spark_checkpoints:/opt/spark/work-dir/checkpoints
      - spark_dlq:/opt/spark/work-dir/dlq

  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.9.0
    depends_on:
      kafka-1:
        condition: service_healthy
    command: ["--kafka.server=kafka-1:29092"]
    ports:
      - "127.0.0.1:${KAFKA_EXPORTER_PORT:-9308}:9308"

  prometheus:
    image: prom/prometheus:v3.5.0
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./infra/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  kafka_data:
  clickhouse_data:
  spark_checkpoints:
  spark_dlq:
